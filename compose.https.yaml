# docker compose -f compose.yaml -f compose.https.yaml up -d --build
# Requires Docker Compose >= 2.24.4 for !reset.
services:
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
