name: POPMES checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: popmes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Python syntax and dependency audit
        run: |
          python -m pip install ruff pip-audit
          ruff check backend --select E9,F821,F822,F823
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck, npm audit and secret scan
        run: |
          npm ci --prefix frontend
          npx --prefix frontend tsc -b --pretty false
          npm audit --prefix frontend --audit-level=high
          bash scripts/scan-secrets.sh
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POP_TEST_URL: http://127.0.0.1:8080
      POP_TEST_USER: admin
      POP_TEST_PASSWORD: CI-local-test-password-932!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated test configuration
        run: |
          python3 scripts/setup.py > /dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('.env')
          lines=[('ADMIN_PASSWORD='+os.environ['POP_TEST_PASSWORD']) if line.startswith('ADMIN_PASSWORD=') else line for line in p.read_text().splitlines()]
          p.write_text('\n'.join(lines)+'\n')
          PY
          docker compose config --quiet
          DOMAIN=ci.example.com docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - name: Build and start the complete Docker stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Scan built images for fixed critical issues
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity CRITICAL --ignore-unfixed popmes-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity CRITICAL --ignore-unfixed popmes-frontend
      - name: Backend tests on PostgreSQL (including concurrent packing)
        run: |
          docker compose exec -T backend python manage.py check
          docker compose exec -T -e DEBUG=0 -e COOKIE_SECURE=1 -e SECURE_HSTS_SECONDS=15552000 -e ALLOWED_HOSTS=popmes.example.com -e CSRF_TRUSTED_ORIGINS=https://popmes.example.com backend python manage.py check --deploy
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
          docker compose exec -T backend python manage.py test core -v 2
      - name: Upgrade an old schema without dropping logo stock
        run: bash scripts/schema-upgrade-check.sh
      - name: Seed sample data
        run: docker compose exec -T backend python manage.py seed_demo
      - name: Browser test
        run: |
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Verify backup, restore, and an isolated restore
        run: |
          docker compose exec -T backend python -c "from pathlib import Path; Path('/app/media/backup-probe.txt').write_text('POPMES backup integrity')"
          docker compose exec -T backend python manage.py dumpdata core --indent 2 > /tmp/before.json
          bash scripts/backup.sh
          backup_path=$(find "$PWD/backups" -mindepth 1 -maxdepth 1 -type d | head -1)
          bash scripts/restore.sh "$backup_path" --replace-current-data
          docker compose exec -T backend python manage.py dumpdata core --indent 2 > /tmp/after.json
          cmp /tmp/before.json /tmp/after.json
          docker compose exec -T backend python -c "from pathlib import Path; assert Path('/app/media/backup-probe.txt').read_text() == 'POPMES backup integrity'"
          bash scripts/backup-restore-test.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
      - name: Stop test containers
        if: always()
        run: docker compose down -v
