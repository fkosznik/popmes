name: popmes
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-popmes}
      # This user is created only when the data volume is empty. Changing it
      # in .env does not rename the role on an existing volume.
      POSTGRES_USER: ${POSTGRES_USER:-popmes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup.py first}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:-}
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
      - ./docker/postgres/roles.sql:/usr/local/share/popmes/roles.sql:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: database
      MEDIA_ROOT: /app/media
      # Restricted role when configured. Otherwise the original database user.
      POSTGRES_USER: ${POSTGRES_APP_USER:-${POSTGRES_USER:-popmes}}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - media_data:/app/media
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  database_data:
  media_data:
